summary: >
  Software engineer with deep, hands-on experience in formal methods —
  interactive theorem proving in Lean 4 across two book-scale formalization
  projects — plus 20+ years building production web, backend, and
  AI-integrated systems. Strengths in Lean 4, Python, JavaScript/TypeScript,
  Rust, and array languages (K/J/APL).

formal_method_note: >
  Method: autoformalization — AI agents draft the Lean 4 proofs, the proof
  assistant checks them, and failures feed back into the next attempt.
  I orchestrate the loop and verify the results; the proofs below were
  not written by hand.

formal_methods:
  - name: laptop
    text: >
      Lean 4 formalization of Eric Hehner's *A Practical Theory of Programming*.
      Full-book blueprint rendered with Verso; all six optional sections plus
      the §7.1.5 residual proved, `lake build` green.
    links:
      - label: repo
        url: https://github.com/tangentproofs/laptop
      - label: site
        url: https://tangentproofs.github.io/laptop/

  - name: conway-knots
    text: >
      Lean 4 formalization of Conway's classification of rational tangles.
      362-item blueprint at 100% coverage of planned scope.
      A verified knot enumeration program from the formalization is planned
      future work.
    links:
      - label: repo
        url: https://github.com/tangentproofs/conway-knots
      - label: site
        url: https://tangentproofs.github.io/conway-knots/

  - name: bex
    text: >
      Rust crate for boolean expressions: expression trees and binary decision
      diagrams, the core data structure of symbolic model checking.
      SAT-solver and combinatorial-search background.
    links:
      - label: repo
        url: https://github.com/tangentstorm/bex

  - name: turyn
    text: >
      Search engine for Turyn-type sequences (four {+1,−1} sequences whose
      combined aperiodic autocorrelations vanish), building blocks for Hadamard
      matrices via the base-sequence → T-sequence → Goethals–Seidel pipeline;
      long-term goal TT(56), yielding a Hadamard matrix of order 668.
      SAT-driven pipeline (persistent CDCL solver, MDD boundary enumeration,
      parallel workers), including an AI-created SAT solver.
    links:
      - label: repo
        url: https://github.com/tangentproofs/turyn

